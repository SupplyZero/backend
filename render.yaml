services:
  - type: web
    name: supplyzero-api
    runtime: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://supplyzero.onrender.com
      - key: MQTT_ENABLED
        value: "false"

  - type: web
    runtime: static
    name: supplyzero
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    envVars:
      - key: VITE_API_BASE_URL
        value: https://supplyzero-api.onrender.com
      - key: VITE_WS_URL
        value: wss://supplyzero-api.onrender.com/ws/stream
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
